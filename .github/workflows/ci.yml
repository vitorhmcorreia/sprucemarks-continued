# Every push and pull request: deploy/ must be exactly what build.js makes from source/, the release build must
# work, and the extension's own test suite must pass in a real (headless) browser. See DECISIONS D15.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: deploy/ matches source/
        run: |
          node build.js
          if [ -n "$(git status --porcelain -- deploy)" ]; then
            git status --short -- deploy
            echo "::error::deploy/ is out of date: run 'node build.js' and commit the result"
            exit 1
          fi

      - name: Release build (no tests, logging off)
        run: |
          node build.js --no-tests --zip
          grep -q "'log': false" dist/package/js/shared.js
          if grep -q "local.test.function" dist/package/background.js; then echo "::error::test suite leaked into the release build"; exit 1; fi

      - name: Install Chrome for Testing
        # branded Chrome ignores --load-extension since 137; Chrome for Testing still loads unpacked extensions
        run: |
          path=$(npx -y @puppeteer/browsers@2.3.0 install chrome@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)
          echo "BROWSER=$path" >> "$GITHUB_ENV"

      - name: Extension test suite
        run: node test/run-tests.js
